name: Auto PR for AI Branches

on:
  create:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    if: >
      github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'ai/')
    runs-on: ubuntu-latest

    steps:
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.event.ref }}"
          REPO="${{ github.repository }}"

          echo "Creating Pull Request for branch '$BRANCH' in repo '$REPO'"

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pulls \
            -d "{
              \"title\": \"AI: $BRANCH\",
              \"head\": \"$BRANCH\",
              \"base\": \"main\",
              \"body\": \"Automatically created PR for AI branch \`$BRANCH\`.\"
            }"
