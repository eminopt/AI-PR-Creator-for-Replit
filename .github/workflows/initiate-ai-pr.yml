name: Auto PR for AI Branches

on:
  create:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    if: >
      github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'ai/')
    runs-on: ubuntu-latest

    steps:
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          BRANCH="${{ github.event.ref }}"
          REPO="${{ github.repository }}"

          echo "AI branch created: $BRANCH"

          # Remove "ai/" prefix
          STRIPPED="${BRANCH#ai/}"

          # Extract base branch (everything before first "/")
          BASE="${STRIPPED%%/*}"

          if [ -z "$BASE" ] || [ "$BASE" = "$STRIPPED" ]; then
            echo "❌ Invalid branch format."
            echo "Expected: ai/<base-branch>/<something>"
            exit 1
          fi

          echo "Derived base branch: $BASE"
          echo "Creating PR: $BRANCH → $BASE"

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pulls \
            -d "{
              \"title\": \"AI: $BRANCH\",
              \"head\": \"$BRANCH\",
              \"base\": \"$BASE\",
              \"body\": \"Automatically created PR for AI branch \`$BRANCH\` targeting \`$BASE\`.\"
            }"
