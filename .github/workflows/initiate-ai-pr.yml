name: Auto PR for AI Branches

on:
  create:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    if: >
      github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'ai/')
    runs-on: ubuntu-latest

    steps:
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          BRANCH="${{ github.event.ref }}"
          REPO="${{ github.repository }}"

          echo "AI branch created: $BRANCH"

          # Extract base branch: everything after the last "/base--"
          if [[ "$BRANCH" != *"/base--"* ]]; then
            echo "❌ Invalid branch format."
            echo "Expected: ai/<feature-name>/base--<base-branch>"
            exit 1
          fi

          BASE="${BRANCH#*/base--}"

          if [ -z "$BASE" ]; then
            echo "❌ Could not determine base branch from '$BRANCH'."
            exit 1
          fi

          echo "Base branch: $BASE"
          echo "Creating PR: $BRANCH → $BASE"

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pulls \
            -d "{
              \"title\": \"AI: $BRANCH\",
              \"head\": \"$BRANCH\",
              \"base\": \"$BASE\",
              \"body\": \"Automatically created PR for AI branch \`$BRANCH\` targeting \`$BASE\`.\"
            }"
